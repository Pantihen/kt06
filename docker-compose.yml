# Всё окружение одной командой:  docker compose up --build   (или docker-compose up --build)
# Перед первым запуском:         cp .env.example .env  и поменяйте пароли/секреты
name: blog-platform

services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Внутри сети compose база и Redis доступны по именам сервисов
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Укажите POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?Укажите POSTGRES_DB в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data # данные БД переживают пересоздание контейнера
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # для npm test и npm run dev с хоста
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"] # AOF — данные Redis тоже сохраняются на диск
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
